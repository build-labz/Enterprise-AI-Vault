<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise AI Vault</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* chat card – clean, glassmorphism */
        .chat-container {
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 2px 8px 0 rgba(0,0,0,0.06);
            padding: 2rem 1.8rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* header */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            margin-bottom: 1.8rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid rgba(0, 0, 0, 0.04);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-left i {
            font-size: 2rem;
            color: #2a7de1;
            background: rgba(42, 125, 225, 0.08);
            padding: 0.5rem;
            border-radius: 1rem;
        }

        .header-left h1 {
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.3px;
            color: #1c2e3f;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .header-left .badge {
            background: #d4e2f0;
            color: #1f3a57;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* restart button – manual reset */
        .restart-btn {
            background: rgba(220, 235, 245, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #1f3a57;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .restart-btn i {
            font-size: 0.9rem;
        }
        .restart-btn:hover {
            background: #2a7de1;
            border-color: #2a7de1;
            color: white;
            box-shadow: 0 8px 16px rgba(42, 125, 225, 0.15);
            transform: scale(0.97);
        }
        .restart-btn:active {
            transform: scale(0.93);
        }
        .restart-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.4);
        }

        /* chat messages – scrollable */
        .chat-messages {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 1.8rem;
            padding: 1.5rem 1.2rem;
            min-height: 280px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1.5rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #b6ccdd;
            border-radius: 10px;
        }

        /* message bubbles */
        .message {
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
            animation: fadeSlide 0.25s ease;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 40px;
            background: #d9e2ed;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #1f3a57;
            font-size: 1.1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .message.user .avatar {
            background: #2a7de1;
            color: white;
        }

        .bubble {
            background: white;
            padding: 0.9rem 1.3rem;
            border-radius: 1.8rem;
            border-top-left-radius: 0.6rem;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
            max-width: 80%;
            word-break: break-word;
            line-height: 1.5;
            color: #1c2e3f;
            font-size: 0.98rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(2px);
        }

        .message.user .bubble {
            background: #2a7de1;
            color: white;
            border-top-right-radius: 0.6rem;
            border-top-left-radius: 1.8rem;
            border-color: #1a5fb0;
            box-shadow: 0 4px 12px rgba(42, 125, 225, 0.15);
        }

        /* typing indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0 0.2rem 0.5rem;
            color: #48647c;
            font-size: 0.9rem;
        }
        .typing-indicator .dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #6f8da5;
            border-radius: 20px;
            margin-right: 4px;
            animation: pulse 1.2s infinite ease-in-out;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 60%, 100% { opacity: 0.2; transform: scale(0.9); }
            30% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* input area */
        .input-area {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            background: white;
            padding: 0.4rem 0.4rem 0.4rem 1.2rem;
            border-radius: 50px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(4px);
            transition: border 0.2s, box-shadow 0.2s;
        }
        .input-area:focus-within {
            border-color: #2a7de1;
            box-shadow: 0 8px 20px rgba(42, 125, 225, 0.08);
            background: white;
        }

        .input-area input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.9rem 0;
            font-size: 1rem;
            color: #1c2e3f;
            outline: none;
        }
        .input-area input::placeholder {
            color: #8ba1b5;
            font-weight: 300;
        }

        .input-area button {
            background: #2a7de1;
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 6px 14px rgba(42, 125, 225, 0.25);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .input-area button:hover {
            background: #1f65c7;
            transform: scale(0.96);
        }
        .input-area button:active {
            background: #1553a8;
            transform: scale(0.92);
        }
        .input-area button:disabled {
            opacity: 0.5;
            pointer-events: none;
            box-shadow: none;
        }

        /* helper text */
        .reset-hint {
            margin-top: 1rem;
            text-align: center;
            color: #6c889e;
            font-size: 0.78rem;
            letter-spacing: 0.2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            opacity: 0.8;
        }
        .reset-hint i {
            font-size: 0.7rem;
            color: #6f8da5;
        }

        /* empty state */
        .empty-state {
            color: #7d98af;
            text-align: center;
            padding: 2rem 1rem 1.2rem;
            font-weight: 300;
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            align-items: center;
        }
        .empty-state i {
            font-size: 2.4rem;
            opacity: 0.3;
            margin-bottom: 0.4rem;
            color: #2a7de1;
        }

        @media (max-width: 480px) {
            .chat-container { padding: 1.2rem; }
            .bubble { max-width: 90%; }
            .chat-header { flex-direction: column; align-items: stretch; }
            .header-left h1 { font-size: 1.3rem; }
            .restart-btn { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="chat-container">
    <!-- header with manual restart button -->
    <div class="chat-header">
        <div class="header-left">
            <i class="fas fa-comment-dots"></i>
            <h1>
                Enterprise AI Vault
                <span class="badge">Trust + AI</span>
            </h1>
        </div>
        <button class="restart-btn" id="restartBtn" title="Clear chat & start fresh">
            <i class="fas fa-rotate-left"></i> Restart
        </button>
    </div>

    <!-- chat messages -->
    <div class="chat-messages" id="chatMessages">
        <div class="empty-state" id="emptyState">
            <i class="fas fa-arrow-right-to-bracket"></i>
            <span>Secure your information, then search inside it.</span>
            <span style="font-size:0.8rem; opacity:0.6;">Currently, only one question &amp; one reply per turn.</span>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <span style="opacity:0.6;">0gm-1.0-35b-a3b</span>
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- input area -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your question…" autofocus />
        <button id="sendBtn" aria-label="Send">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
    <div class="reset-hint">
        <i class="fas fa-hand-pointer"></i>
        <span>Click <strong>Restart</strong> to clear chat</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // DOM refs
        const messagesContainer = document.getElementById('chatMessages');
        const emptyState = document.getElementById('emptyState');
        const typingIndicator = document.getElementById('typingIndicator');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const restartBtn = document.getElementById('restartBtn');

        let isProcessing = false;

        // --- scroll to bottom ---
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // --- update empty state visibility ---
        function updateEmptyState() {
            const hasMessages = messagesContainer.querySelectorAll('.message').length > 0;
            emptyState.style.display = hasMessages ? 'none' : 'flex';
        }

        // --- add a message bubble ---
        function addMessage(text, sender) {
            if (emptyState.style.display !== 'none') {
                emptyState.style.display = 'none';
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.innerHTML = sender === 'user' 
                ? '<i class="fas fa-user"></i>' 
                : '<i class="fas fa-robot"></i>';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);

            // insert before typing indicator if visible
            if (typingIndicator.style.display === 'flex') {
                messagesContainer.insertBefore(msgDiv, typingIndicator);
            } else {
                messagesContainer.appendChild(msgDiv);
            }

            updateEmptyState();
            scrollToBottom();
        }

        // --- typing indicator ---
        function showTyping(show) {
            typingIndicator.style.display = show ? 'flex' : 'none';
            if (show) {
                messagesContainer.appendChild(typingIndicator);
                scrollToBottom();
            }
        }

        // --- MANUAL RESET: clear all messages, keep empty state ---
        function resetChat() {
            // remove all .message elements
            const allMessages = messagesContainer.querySelectorAll('.message');
            allMessages.forEach(el => el.remove());

            // hide typing
            showTyping(false);

            // show empty state
            updateEmptyState();

            // clear input & focus
            userInput.value = '';
            userInput.focus();

            // enable send button & reset processing flag
            sendBtn.disabled = false;
            isProcessing = false;

            // enable restart button (it's never disabled, but just in case)
            restartBtn.disabled = false;
        }

        // --- handle send (user question) ---
        async function handleSend() {
            const rawText = userInput.value.trim();
            if (!rawText) return;
            if (isProcessing) return;

            // Add user message
            addMessage(rawText, 'user');
            userInput.value = '';
            userInput.focus();

            // Show typing indicator
            showTyping(true);
            sendBtn.disabled = true;
            isProcessing = true;
            restartBtn.disabled = true;

            try {
                // Send POST request to your API
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: rawText,
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Hide typing indicator
                showTyping(false);
                
                // Add assistant response
                // Adjust based on your API response structure
                const assistantMessage = data.response || data.message || data.text || JSON.stringify(data);
                addMessage(assistantMessage, 'assistant');

            } catch (error) {
                console.error('API Error:', error);
                showTyping(false);
                addMessage('⚠️ Sorry, I encountered an error. Please try again.', 'assistant');
            } finally {
                sendBtn.disabled = false;
                isProcessing = false;
                restartBtn.disabled = false;
                userInput.focus();
            }
        }

        // --- EVENT LISTENERS ---

        // Send button
        sendBtn.addEventListener('click', handleSend);

        // Enter key
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // Restart button – manual reset
        restartBtn.addEventListener('click', () => {
            if (isProcessing) return; // safety
            resetChat();
            // also re-enable restart (it's already enabled, but keep)
            restartBtn.disabled = false;
            userInput.focus();
        });

        // Click on messages -> focus input
        messagesContainer.addEventListener('click', () => {
            userInput.focus();
        });

        // Init: clean start
        window.addEventListener('load', () => {
            resetChat();
            userInput.focus();
        });

        // Extra: Escape key resets (optional, but we keep it as convenience)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !isProcessing) {
                resetChat();
                userInput.focus();
            }
        });

    })();
</script>
</body>
</html>
